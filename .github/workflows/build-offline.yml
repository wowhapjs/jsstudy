name: Build offline HTML

on:
  push:
    branches: [offline-artifact]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct standalone HTML
        run: |
          cat payload-xz/part-*.b64 | base64 -d | xz -d > jsstudy_offline_standalone.html
          test -s jsstudy_offline_standalone.html
          ! grep -q 'sync.js' jsstudy_offline_standalone.html
          ! grep -q '/api/' jsstudy_offline_standalone.html
      - name: Upload offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: jsstudy-offline-html
          path: jsstudy_offline_standalone.html
          retention-days: 1
