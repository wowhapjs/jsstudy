services:
  web:
    image: nginx:alpine
    container_name: jsstudy
    restart: unless-stopped
    ports:
      - "127.0.0.1:31005:80"
    volumes:
      - ./payload-xz:/payload:ro
    command:
      - /bin/sh
      - -c
      - >-
        cat /payload/part-*.b64 | base64 -d | unxz > /usr/share/nginx/html/index.html
        && exec nginx -g 'daemon off;'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
