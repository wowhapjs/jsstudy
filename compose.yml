services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: jsstudy
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - jsstudy-db:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - dbnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jsstudy"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator@db:5432/jsstudy
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_SERVER_PORT: 3000
    networks:
      - dbnet
      - frontnet
    security_opt:
      - no-new-privileges:true

  web:
    image: nginx:alpine
    container_name: jsstudy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:31005:80"
    volumes:
      - ./payload-xz:/payload:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./sync.js:/assets/sync.js:ro
    command:
      - /bin/sh
      - -c
      - >-
        cat /payload/part-*.b64 | base64 -d | unxz > /usr/share/nginx/html/index.html
        && cp /assets/sync.js /usr/share/nginx/html/sync.js
        && exec nginx -g 'daemon off;'
    networks:
      - frontnet
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE

volumes:
  jsstudy-db:

networks:
  dbnet:
    internal: true
  frontnet:
